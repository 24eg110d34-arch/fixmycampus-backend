spring.application.name=FixMyCampus
server.port=${PORT:8080}

# ---- Database: Railway MySQL, custom DB_URL, or local MySQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:fixmycampus}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:root}}}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- File upload (issue images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---- JWT (override JWT_SECRET in real deployments; must be 32+ characters) ----
app.jwt.secret=${JWT_SECRET:fixmycampus-dev-secret-change-me-please-0123456789}
app.jwt.expiration-ms=28800000

# ---- Default admin account created on first start ----
app.admin.name=Campus Admin
app.admin.email=admin@fixmycampus.com
app.admin.password=Admin@123

# ---- CORS: addresses the frontend may be served from (comma separated) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}

