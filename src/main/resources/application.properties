spring.application.name=FixMyCampus
server.port=8080

# ---- MySQL (change username/password for your machine) ----
spring.datasource.url=jdbc:mysql://localhost:3306/fixmycampus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- File upload (issue images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# ---- JWT (override JWT_SECRET in real deployments; must be 32+ characters) ----
app.jwt.secret=${JWT_SECRET:fixmycampus-dev-secret-change-me-please-0123456789}
app.jwt.expiration-ms=28800000

# ---- Default admin account created on first start ----
app.admin.name=Campus Admin
app.admin.email=admin@fixmycampus.com
app.admin.password=Admin@123

# ---- CORS: addresses the frontend may be served from (comma separated) ----
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173
